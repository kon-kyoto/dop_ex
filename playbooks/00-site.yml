- name: Init etcd
  hosts: etcd
  become: yes
  roles:
    - role: etcd
      tags: etcd_setup

- name: Init postgres + patroni
  hosts: servers
  become: yes
  pre_tasks:
    - name: Add all hosts to /etc/hosts
      blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          {% for host in groups['all'] %}
          {{ hostvars[host].ansible_host }}  {{ host }}
          {% endfor %}
      tags: always
  roles:
    - role: postgresql
      tags: db_setup
    - role: patroni
      tags: patroni_setup
