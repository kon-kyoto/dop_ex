- name: Install dependencies
  apt:
    name:
      - curl
      - tar
      - openssl
    state: present
    update_cache: yes

- name: Create etcd group
  group:
    name: etcd
    system: yes

- name: Create etcd user
  user:
    name: etcd
    system: yes
    shell: /sbin/nologin
    group: etcd

- name: Download etcd
  get_url:
    url: "https://github.com/etcd-io/etcd/releases/download/v{{ etcd_version }}/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
    dest: /tmp/etcd.tar.gz
    mode: '0644'

- name: Extract etcd
  unarchive:
    src: /tmp/etcd.tar.gz
    dest: /tmp
    remote_src: yes

- name: Install etcd
  copy:
    src: "/tmp/etcd-v{{ etcd_version }}-linux-amd64/{{ item }}"
    dest: "/usr/bin/{{ item }}"
    remote_src: yes
    mode: '0755'
  loop:
    - etcd
    - etcdctl

- name: Create etcd dir
  file:
    path: "{{ item }}"
    state: directory
    owner: etcd
    group: etcd
    mode: '0755'
  loop:
    - /var/lib/etcd
    - /var/lib/etcd/default
    - /etc/etcd
    - /etc/default/etcd/.tls

- name: Generate CA key
  openssl_privatekey:
    path: /etc/default/etcd/.tls/ca.key
    size: 4096
  run_once: true
  delegate_to: "{{ groups['etcd'][0] }}"

- name: Generate CA cert
  openssl_csr:
    path: /etc/default/etcd/.tls/ca.csr
    privatekey_path: /etc/default/etcd/.tls/ca.key
    common_name: myorg.com
  run_once: true
  delegate_to: "{{ groups['etcd'][0] }}"

- name: Self-sign CA
  openssl_certificate:
    path: /etc/default/etcd/.tls/ca.crt
    csr_path: /etc/default/etcd/.tls/ca.csr
    privatekey_path: /etc/default/etcd/.tls/ca.key
    provider: selfsigned
  run_once: true
  delegate_to: "{{ groups['etcd'][0] }}"

- name: Generate node keys (on first etcd node)
  openssl_privatekey:
    path: "/etc/default/etcd/.tls/{{ item }}.key"
    size: 4096
  loop: "{{ groups['etcd'] + groups['servers'] }}"
  run_once: true
  delegate_to: "{{ groups['etcd'][0] }}"

- name: Generate node CSRs (on first etcd node)
  openssl_csr:
    path: "/etc/default/etcd/.tls/{{ item }}.csr"
    privatekey_path: "/etc/default/etcd/.tls/{{ item }}.key"
    common_name: "{{ item }}"
    subject_alt_name:
      - "DNS:{{ item }}"
      - "IP:{{ hostvars[item].ansible_host }}"
      - "IP:127.0.0.1"
  loop: "{{ groups['etcd'] + groups['servers'] }}"
  run_once: true
  delegate_to: "{{ groups['etcd'][0] }}"

- name: Sign node certs (on first etcd node)
  openssl_certificate:
    path: "/etc/default/etcd/.tls/{{ item }}.crt"
    csr_path: "/etc/default/etcd/.tls/{{ item }}.csr"
    privatekey_path: /etc/default/etcd/.tls/ca.key
    provider: ownca
    ownca_path: /etc/default/etcd/.tls/ca.crt
    ownca_privatekey_path: /etc/default/etcd/.tls/ca.key
  loop: "{{ groups['etcd'] + groups['servers'] }}"
  run_once: true
  delegate_to: "{{ groups['etcd'][0] }}"

- name: Fix ownership on TLS directory
  file:
    path: /etc/default/etcd/.tls
    state: directory
    owner: etcd
    group: etcd
    mode: '0750'
    recurse: yes

- name: Fix permissions on TLS private keys
  file:
    path: "{{ item }}"
    owner: etcd
    group: etcd
    mode: '0600'
  loop:
    - /etc/default/etcd/.tls/ca.key
    - "/etc/default/etcd/.tls/{{ inventory_hostname }}.key"

- name: Deploy etcd config
  template:
    src: etcd.conf.yml.j2
    dest: /etc/etcd/etcd.conf.yml
    owner: etcd
    group: etcd
    mode: '0644'
  notify: reload systemd and restart etcd

- name: Deploy etcd systemd unit
  template:
    src: etcd.service.j2
    dest: /etc/systemd/system/etcd.service
  notify: reload systemd and restart etcd

- name: Start etcd on each node sequentially
  systemd:
    name: etcd
    state: started
    enabled: yes
  throttle: 1
