- name: Install build dependencies
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - python3-dev
      - libpq-dev
      - build-essential
    state: present
    update_cache: yes

- name: Create Patroni venv
  command: python3 -m venv /opt/patroni
  args:
    creates: /opt/patroni/bin/activate

- name: Install Patroni
  pip:
    name:
      - "patroni[etcd3]"
      - psycopg2-binary
    virtualenv: /opt/patroni
    state: present

- name: Create Patroni config directory
  file:
    path: /etc/patroni
    state: directory
    owner: postgres
    group: postgres
    mode: '0750'

- name: Create Patroni log directory
  file:
    path: /data/log/patroni
    state: directory
    owner: postgres
    group: postgres
    mode: '0755'

- name: Deploy Patroni config
  template:
    src: patroni.yml.j2
    dest: /etc/patroni/config.yml
    owner: postgres
    group: postgres
    mode: '0600'
  notify: Restart patroni

- name: Deploy Patroni systemd unit
  ansible.builtin.template:
    src: patroni.service.j2
    dest: /etc/systemd/system/patroni.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart patroni

- name: Start Patroni
  systemd:
    name: patroni
    state: started
    enabled: yes
    daemon_reload: yes
