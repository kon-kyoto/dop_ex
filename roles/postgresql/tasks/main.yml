- name: Install prerequisites
  apt:
    name:
      - python3-debian
      - curl
      - ca-certificates
      - gnupg
    state: present
    update_cache: yes

- name: Add PGDG repository
  deb822_repository:
    name: pgdg
    types: deb
    uris: http://apt.postgresql.org/pub/repos/apt
    suites: "{{ ansible_distribution_release }}-pgdg"
    components: main
    signed_by: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present

- name: Install PostgreSQL
  apt:
    name:
      - "postgresql-{{ pg_version }}"
      - "postgresql-contrib-{{ pg_version }}"
    state: present
    update_cache: yes

- name: Stop and disable default PostgreSQL service
  systemd:
    name: postgresql
    state: stopped
    enabled: no
  ignore_errors: yes

- name: Create postgres home
  file:
    path: /home/postgres
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'

- name: Set postgres user home
  user:
    name: postgres
    home: /home/postgres

- name: Create PGDATA directory
  file:
    path: "/data/{{ pg_version }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'

- name: Create log directory
  file:
    path: /data/log
    state: directory
    owner: postgres
    group: postgres
    mode: '0755'

- name: Create socket directory
  file:
    path: /var/run/postgresql
    state: directory
    owner: postgres
    group: postgres
    mode: '0755'
